function studio(){const a=assets.find(x=>x.id===s.asset)||assets[0],c=getCopy(s.asset,s.lang),qa=qaReport();const count=qa.issues.filter(i=>i.asset===s.asset&&(!i.lang||i.lang===s.lang));return `<div class="page-head"><div><div class="eyebrow">${I('sparkle',14)} CAMPAIGN STUDIO · V${s.version}</div><h1>Every asset, in one flow.</h1><p>Switch formats, localize content, and refine each creative.</p></div><div class="page-head-actions"><button class="btn" data-action="nav" data-view="brief">${I('sliders')} Edit brief</button><button class="btn primary" data-action="nav" data-view="qa">${I('shield')} Run QA</button></div></div><div class="studio-grid"><aside class="surface asset-list"><div class="panel-title">DELIVERABLES <span class="small-tag">5</span></div><div class="asset-pickers">${assets.map(x=>`<button class="asset-picker ${s.asset===x.id?'selected':''}" data-action="open-asset" data-id="${x.id}"><span class="picker-icon">${I(x.glyph)}</span><span><b>${x.name}</b><small>${x.type}</small></span></button>`).join('')}</div><hr class="inspector-sep"/><div class="panel-title">LANGUAGE</div><div class="segmented" style="width:100%"><button style="flex:1" data-action="language" data-lang="en" class="${s.lang==='en'?'selected':''}">English</button><button style="flex:1" data-action="language" data-lang="ar" class="${s.lang==='ar'?'selected':''}">العربية</button></div><p class="hint" style="margin-top:14px">${I('info',13)} Each format has English and Arabic copy.</p></aside><section class="surface canvas-panel"><div class="panel-toolbar"><div><strong>${H(a.name)}</strong><div class="version-tag">${a.type} · ${s.lang==='en'?'English':'Arabic'}</div></div><div class="segmented"><button class="${s.device==='desktop'?'selected':''}" data-action="device" data-device="desktop" aria-label="Desktop preview" title="Desktop">${I('monitor',15)}</button><button class="${s.device==='mobile'?'selected':''}" data-action="device" data-device="mobile" aria-label="Mobile preview" title="Mobile">${I('mobile',15)}</button></div></div><div class="preview-stage ${s.device==='mobile'?'mobile':''}" id="previewStage"><div class="preview-wrap" id="previewTarget">${preview(s.asset,s.lang)}</div></div><div class="preview-foot"><small>Live preview · ${s.lang==='ar'?'Arabic RTL':'English LTR'} · Version ${s.version}</small><button class="btn small" data-action="download-current">${I('download',14)} Export asset</button></div></section><aside class="surface inspector"><div class="inspector-top"><h3>Creative properties</h3><span class="small-tag ${s.approvals[`${s.asset}|${s.lang}`]?'green':'gray'}">${s.approvals[`${s.asset}|${s.lang}`]?'Approved':'Draft'}</span></div><div class="field"><label for="copy-head">Headline</label><textarea id="copy-head" data-edit="headline" rows="3" dir="${s.lang==='ar'?'rtl':'ltr'}">${H(c.headline)}</textarea></div><div class="field"><label for="copy-body">Body copy</label><textarea id="copy-body" data-edit="body" rows="4" dir="${s.lang==='ar'?'rtl':'ltr'}">${H(c.body)}</textarea></div><div class="field"><label for="copy-cta">Call to action</label><input id="copy-cta" data-edit="cta" value="${H(c.cta)}" dir="${s.lang==='ar'?'rtl':'ltr'}"/></div><div class="row-flex" style="margin:2px 0"><span class="hint">Custom edits are saved locally.</span><button class="btn small ghost" data-action="restore-copy">${I('refresh',13)} Reset</button></div><hr class="inspector-sep"/><div class="panel-title">QUALITY CHECKS <span class="small-tag ${count.some(q=>q.level==='error')?'red':'green'}">${count.some(q=>q.level==='error')?'Review':'Ready'}</span></div><div class="mini-check">${I('check')} Brand palette linked to brand kit</div><div class="mini-check">${I('check')} ${s.lang==='ar'?'RTL language direction':'Correct English direction'}</div><div class="mini-check">${I('check')} Versioned campaign content</div>${count.filter(i=>i.level==='error').map(i=>`<div class="mini-check" style="color:#c85269">${I('alert')} ${H(i.detail)}</div>`).join('')}<hr class="inspector-sep"/><div class="inspector-actions"><button class="btn primary" data-action="approve">${I('check',14)} ${s.approvals[`${s.asset}|${s.lang}`]?'Unapprove':'Approve'}</button><button class="btn" data-action="download-current">${I('download',14)} Export</button></div></aside></div>`;}
function field(name,label,value,type='text',extra=''){return `<div class="field ${extra}"><label for="${name}">${label}</label><input id="${name}" data-brief="${name}" type="${type}" value="${H(value)}" ${type==='number'?'min="1" max="365"':''}></div>`;}
function briefPage(){return `<div class="page-head"><div><div class="eyebrow">${I('sliders',14)} STRATEGY & DIRECTION</div><h1>Your creative starts here.</h1><p>Update the brief once; refresh all connected campaign assets.</p></div><span class="small-tag">Current version v${s.version}</span></div><div class="form-layout"><section class="surface form-card"><h2>Campaign brief</h2><p>Set the facts that power every piece of creative. Changes are applied together, with approvals reset for review.</p><div class="form-grid">${field('name','Campaign name',draft.name)}${field('objective','Primary objective',draft.objective)}<div class="field wide"><label for="audience">Target audience</label><input id="audience" data-brief="audience" value="${H(draft.audience)}"/></div>${field('trialDays','Free trial duration (days)',draft.trialDays,'number')}${field('ctaEn','Primary CTA · English',draft.ctaEn)}<div class="field wide"><label for="ctaAr">Primary CTA · Arabic</label><input id="ctaAr" data-brief="ctaAr" dir="rtl" value="${H(draft.ctaAr)}"/></div><div class="field wide"><label for="note">Creative direction & constraints</label><textarea id="note" data-brief="note">${H(draft.note)}</textarea></div></div><div class="form-foot"><small>Local template-based content updates. This file does not call an AI model or external service.</small><button class="btn primary" data-action="apply-brief">${I('refresh')} Apply campaign changes</button></div></section><aside><div class="surface aside-card"><div class="row-flex"><h3>Current offer</h3><span class="small-tag green">Approved fact</span></div><div style="font-size:45px;font-weight:900;letter-spacing:-2px;color:var(--purple-dark)">${H(s.brief.trialDays)} <span style="font-size:15px">days</span></div><p>Free trial duration currently used by your generated content. Updating it creates a new campaign version.</p></div><div class="surface aside-card"><h3>Change impact</h3>${['Social media · 6 variants','Landing page · 2 variants','Launch email · 2 variants','Previous approvals'].map((v,i)=>`<div class="check-row" style="padding:10px;margin-bottom:7px"><span style="color:#765fe7">${I(i===3?'refresh':'check',16)}</span><div class="check-text"><strong>${v}</strong></div></div>`).join('')}<p>Manual copy overrides are retained, then checked for outdated offers and other conflicts.</p></div></aside></div>`;}
function brandPage(){return `<div class="page-head"><div><div class="eyebrow">${I('palette',14)} BRAND SYSTEM</div><h1>Stay unmistakably on brand.</h1><p>Centralize the visual and verbal rules used across every asset.</p></div><button class="btn primary" data-action="nav" data-view="studio">${I('arrow')} See campaign</button></div><div class="form-layout"><section class="surface form-card"><h2>Identity & voice</h2><p>Your shared brand source of truth. Changes to colors update the studio immediately.</p><div class="form-grid"><div class="field wide"><label for="brand-name">Brand name</label><input id="brand-name" data-brand="name" value="${H(s.brand.name)}"/></div><div class="field wide"><label for="brand-desc">Brand description</label><textarea id="brand-desc" data-brand="description">${H(s.brand.description)}</textarea></div><div class="field"><label for="primary">Primary color</label><input id="primary" data-brand="primary" type="color" value="${H(s.brand.primary)}" style="height:45px;padding:5px"/></div><div class="field"><label for="accent">Accent color</label><input id="accent" data-brand="accent" type="color" value="${H(s.brand.accent)}" style="height:45px;padding:5px"/></div><div class="field wide"><label for="tone">Tone of voice</label><select id="tone" data-brand="tone">${['Friendly & confident','Premium & refined','Bold & energetic','Simple & professional','Warm & playful'].map(v=>`<option ${s.brand.tone===v?'selected':''}>${v}</option>`).join('')}</select></div><div class="field wide"><label for="banned">Prohibited terms (comma-separated)</label><textarea id="banned" data-brand="banned">${H(s.brand.banned)}</textarea></div><div class="field wide"><label for="facts">Approved product facts (semicolon-separated)</label><textarea id="facts" data-brand="facts">${H(s.brand.facts)}</textarea></div></div><div class="form-foot"><small>Brand settings are saved automatically. Re-approve altered assets before final export.</small><button class="btn primary" data-action="nav" data-view="qa">${I('shield')} Review brand QA</button></div></section><aside><div class="surface aside-card"><h3>Brand identity preview</h3><div id="brandPreview"><div class="brand-poster"><b>✳ ${H(s.brand.name)}</b><p>${H(s.brand.description)}</p></div></div><div class="swatch-row"><div class="swatch" style="background:${H(s.brand.primary)}"></div><div class="swatch" style="background:${H(s.brand.accent)}"></div><div class="swatch" style="background:#231f3f"></div></div><p>Primary · Accent · Deep ink</p></div><div class="surface aside-card"><h3>How your brand rules work</h3><p>Color changes apply to all live previews. The QA engine scans every content variant for prohibited terms and claims requiring review.</p><span class="small-tag green">${I('lock',12)} Local browser storage</span></div></aside></div>`;}
function contrast(hex){let x=hex.replace('#','');if(!/^[0-9a-f]{6}$/i.test(x))return 21;const ch=[0,2,4].map(k=>parseInt(x.slice(k,k+2),16)/255).map(v=>v<=.04045?v/12.92:Math.pow((v+.055)/1.055,2.4));return 1/(.2126*ch[0]+.7152*ch[1]+.0722*ch[2]+.05);}
function qaReport(){let issues=[],count=0;const banned=s.brand.banned.split(',').map(t=>t.trim()).filter(Boolean);for(const a of assets)for(const lang of ['en','ar']){count++;let c=getCopy(a.id,lang);for(const [field,value] of Object.entries(c)){if(!String(value).trim())issues.push({level:'error',asset:a.id,lang,detail:`Missing ${field} in ${a.name} (${lang.toUpperCase()})`});for(const term of banned){if(String(value).toLowerCase().includes(term.toLowerCase()))issues.push({level:'error',asset:a.id,lang,detail:`Prohibited phrase “${term}” in ${a.name} (${lang.toUpperCase()})`});}if(/(?:50,000 companies|100% guaranteed|number one worldwide)/i.test(value))issues.push({level:'error',asset:a.id,lang,detail:`Unsupported marketing claim in ${a.name} (${lang.toUpperCase()})`});if(field!=='cta'&&lang==='en'){const nums=[...String(value).matchAll(/\b(\d{1,3})[ -]day\b/gi)].map(x=>Number(x[1]));if(nums.some(n=>n!==Number(s.brief.trialDays)))issues.push({level:'error',asset:a.id,lang,detail:`Outdated trial duration in ${a.name} (${lang.toUpperCase()})`});}if(field!=='cta'&&lang==='ar'){const nums=[...String(value).matchAll(/(\d{1,3})\s*(?:يومًا|أيام|يوم)/g)].map(x=>Number(x[1]));if(nums.some(n=>n!==Number(s.brief.trialDays)))issues.push({level:'error',asset:a.id,lang,detail:`Outdated Arabic trial duration in ${a.name}`});}}
 if(c.cta!==(lang==='en'?s.brief.ctaEn:s.brief.ctaAr))issues.push({level:'warning',asset:a.id,lang,detail:`CTA differs from current brief: ${a.name} (${lang.toUpperCase()})`});}
 if(contrast(s.brand.primary)<4.5)issues.push({level:'warning',asset:null,lang:null,detail:'Primary color may lack contrast with white text (WCAG AA normal text).'});
 issues.push({level:'review',asset:null,lang:'ar',detail:'Arabic copy needs native-language and cultural review before publication.'});issues.push({level:'review',asset:null,lang:null,detail:'Email client rendering and legal claims need human review before sending.'});
 const errors=issues.filter(i=>i.level==='error').length,warnings=issues.filter(i=>i.level==='warning').length,reviews=issues.filter(i=>i.level==='review').length;return {issues,errors,warnings,reviews,count,score:Math.max(0,100-errors*15-warnings*5)};}
function qaPage(){const q=qaReport();const checkGroups=[...q.issues.filter(x=>x.level!=='review'),...q.issues.filter(x=>x.level==='review')];return `<div class="page-head"><div><div class="eyebrow">${I('shield',14)} QUALITY ASSURANCE</div><h1>Beautiful. Consistent. Accountable.</h1><p>Automated checks plus explicit flags for human creative review.</p></div><button class="btn primary" data-action="run-qa">${I('refresh')} Run all checks</button></div><div class="surface health-header"><div><div class="eyebrow">CAMPAIGN HEALTH</div><div class="health-score">${q.score}<small>/100</small></div><div class="hint">${q.errors?'Blocking content errors need attention':'No blocking content errors in the current templates'} · ${q.count} language variants scanned</div></div><span class="health-bubble">${I(q.errors?'alert':'shield',33)}</span></div><div class="qa-layout"><div class="surface qa-main"><div class="section-head"><div><h2 class="section-label">Validation findings</h2><p>${q.errors+q.warnings} automated issue(s) · ${q.reviews} human review item(s)</p></div><span class="small-tag ${q.errors?'red':'green'}">${q.errors?'Action needed':'Checks complete'}</span></div>${!q.errors&&!q.warnings?`<div class="check-row"><span class="check-ico">${I('check')}</span><div class="check-text"><strong>No automated blockers detected</strong><p>All ${q.count} variants checked for missing copy, prohibited terms, mismatched offers and CTAs.</p></div><span class="small-tag green">Passed</span></div>`:''}${checkGroups.map(i=>`<div class="check-row ${i.level==='error'?'bad':i.level==='warning'?'warn':''}"><span class="check-ico">${I(i.level==='error'?'alert':i.level==='warning'?'info':'check',17)}</span><div class="check-text"><strong>${i.level==='error'?'Needs a fix':i.level==='warning'?'Worth checking':'Human review required'}</strong><p>${H(i.detail)}</p></div><span class="small-tag ${i.level==='error'?'red':i.level==='warning'?'amber':'gray'}">${i.level}</span></div>`).join('')}<div class="hint" style="padding-top:14px">Last manually run: ${H(s.lastQA)}. This validator checks known rules; it does not certify legal compliance or subjective creative quality.</div></div><aside class="surface qa-side"><h2 class="section-label">Audit summary</h2><p class="hint">Across all five campaign assets in both languages.</p><div class="metric-line"><span>Assets validated</span><b>${q.count}</b></div><div class="metric-line"><span>Blocking errors</span><b style="color:${q.errors?'#d45669':'#15956c'}">${q.errors}</b></div><div class="metric-line"><span>Warnings</span><b>${q.warnings}</b></div><div class="metric-line"><span>Human review items</span><b>${q.reviews}</b></div><div class="metric-line"><span>Brief version</span><b>v${s.version}</b></div><button class="btn primary" style="width:100%;margin-top:24px" data-action="nav" data-view="export">${I('package')} Go to exports</button></aside></div>`;}
function exportPage(){const q=qaReport();return `<div class="page-head"><div><div class="eyebrow">${I('package',14)} EXPORT CENTER</div><h1>From idea to delivery.</h1><p>Take your campaign with you in open, portable formats.</p></div><span class="small-tag ${q.errors?'red':'green'}">${q.errors?q.errors+' QA blocker(s)':'Content checks passed'}</span></div><div class="surface" style="padding:24px;margin-bottom:20px"><div class="row-flex" style="flex-wrap:wrap"><div><h2 class="section-label">${H(s.brief.name)}</h2><p class="hint">${H(s.brand.name)} · 5 assets · Arabic + English · Version ${s.version}</p></div><span class="small-tag ${q.errors?'red':'amber'}">${q.errors?'Export with content warnings':'Human review pending'}</span></div><div class="swatch-row" style="max-width:260px"><div class="swatch" style="background:${H(s.brand.primary)}"></div><div class="swatch" style="background:${H(s.brand.accent)}"></div><div class="swatch" style="background:#211d3d"></div></div><p class="hint">Downloads are generated in your browser. No uploads, cloud account, or external libraries required.</p></div><div class="section-head"><div><h2 class="section-label">Download formats</h2><p>Usable artifacts, not screenshots of an interface.</p></div></div><div class="export-list">${[['all','Complete campaign kit','One self-contained HTML containing all 10 campaign variants.','package'],['json','Campaign source data','Brand kit, campaign brief, copy, approvals and version history.','file'],['landing','Landing page HTML','Responsive landing page preview for the selected language.','monitor'],['email','Marketing email HTML','Standalone email creative for the selected language.','mail'],['social','Social design SVG','An editable vector version of your selected social post.','image']].map(x=>`<div class="surface export-option"><span class="export-icon">${I(x[3])}</span><div><h3>${x[1]}</h3><p>${x[2]}</p></div><button class="btn small outline-purple" data-action="export-${x[0]}">${I('download',14)}</button></div>`).join('')}</div><div class="surface" style="padding:22px;margin-top:18px"><div class="row-flex"><div><h2 class="section-label">Before sending to a client</h2><p class="hint">Verify product claims, localize with a native speaker, test email rendering, and confirm accessibility.</p></div><button class="btn" data-action="nav" data-view="qa">View QA report ${I('arrow',14)}</button></div></div>`;}
function render(){updateTheme();document.getElementById('app').innerHTML=appFrame();document.getElementById('page').innerHTML=({overview,studio,brief:briefPage,brand:brandPage,qa:qaPage,export:exportPage}[s.view]||overview)();save();}
function navigate(v){s.view=v;if(v==='brief')draft={...s.brief};render();window.scrollTo({top:0,behavior:'instant'});}
function notify(msg){const el=document.getElementById('toast');el.innerHTML=`<span class="dot"></span> ${H(msg)}`;el.classList.add('on');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('on'),3100);}
function setAsset(id){s.asset=id;navigate('studio');}
function setOverride(field,value){s.overrides[`${s.asset}|${s.lang}|${field}`]=value;s.approvals[`${s.asset}|${s.lang}`]=false;save();const p=document.getElementById('previewTarget');if(p)p.innerHTML=preview(s.asset,s.lang);}
function applyBrief(){const duration=Number(draft.trialDays);if(!Number.isInteger(duration)||duration<1||duration>365){notify('Trial duration must be between 1 and 365 days.');return;}if(!draft.name.trim()||!draft.ctaEn.trim()||!draft.ctaAr.trim()){notify('Campaign name and both CTA fields are required.');return;}const changes=Object.keys(s.brief).filter(k=>String(s.brief[k])!==String(draft[k]));if(!changes.length){notify('No changes to apply.');return;}s.brief={...draft,trialDays:duration};s.version++;s.approvals={};s.history.push({version:s.version,description:`Updated ${changes.map(k=>({trialDays:'trial duration',ctaEn:'English CTA',ctaAr:'Arabic CTA',note:'creative direction'}[k]||k)).join(', ')}`,at:new Date().toLocaleString()});save();render();notify(`Campaign v${s.version} created. All assets refreshed; approvals reset.`);}
function approve(){const k=`${s.asset}|${s.lang}`;const relevant=qaReport().issues.filter(i=>i.level==='error'&&i.asset===s.asset&&i.lang===s.lang);if(relevant.length){notify('Fix blocking QA issues before approval.');return;}s.approvals[k]=!s.approvals[k];render();notify(s.approvals[k]?'Asset approved for internal review.':'Asset returned to draft.');}
function downloadFile(name,data,type){const blob=new Blob([data],{type});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);notify(`Downloaded ${name}`);}
const safeFile=(v)=>String(v||'campaign').toLowerCase().replace(/[^a-z0-9]+/gi,'-').replace(/^-|-$/g,'').slice(0,55)||'campaign';
function docExport(kind,lang){const name=H(s.brand.name);const head=`<!doctype html><html lang="${lang}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${name} — ${kind}</title><style>${document.getElementById('app-styles').textContent}\n:root{--brand-primary:${s.brand.primary};--brand-accent:${s.brand.accent}}body{background:#f6f6fa;padding:25px}.site-preview,.email-preview{max-width:790px;margin:25px auto}.campaign-export{max-width:1100px;margin:auto}.social-canvas{max-width:500px}</style></head><body>`;const content=kind==='landing'?landingPreview(lang):kind==='email'?emailPreview(lang):'';return head+content+'</body></html>';}
function socialSVG(id,lang){const c=getCopy(id,lang),rtl=lang==='ar',p=/^#[0-9a-f]{6}$/i.test(s.brand.primary)?s.brand.primary:'#6657e8',accent=id==='social1'?'#2b234f':id==='social2'?'#f6e0d6':s.brand.accent,fg=id==='social1'?'#ffffff':'#211d3d',font=rtl?'Tahoma,Arial,sans-serif':'Arial,sans-serif';const h=c.headline.length>38?c.headline.slice(0,38)+'…':c.headline;let split=h.split(' '),lines=[],line='';for(let word of split){if((line+' '+word).length>(rtl?15:17)&&line){lines.push(line);line=word}else line+=(line?' ':'')+word}if(line)lines.push(line);const anchor=rtl?'end':'start',x=rtl?940:70;const tspan=lines.slice(0,4).map((t,i)=>`<tspan x="${x}" dy="${i?69:0}">${X(t)}</tspan>`).join('');return `<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" role="img" aria-label="${X(c.headline)}"><rect width="1080" height="1080" fill="${accent}"/><circle cx="1020" cy="560" r="290" fill="${p}"/><text x="${x}" y="113" font-family="${font}" font-size="41" text-anchor="${anchor}" font-weight="bold" fill="${fg}">✳ ${X(s.brand.name)}</text><text x="${x}" y="380" font-family="${font}" font-size="73" font-weight="bold" text-anchor="${anchor}" fill="${fg}">${tspan}</text><rect x="70" y="860" width="460" height="94" rx="19" fill="${id==='social1'?'#d8f5e7':'#282240'}"/><text x="300" y="918" font-family="${font}" font-size="31" font-weight="bold" fill="${id==='social1'?'#211d3d':'white'}" text-anchor="middle">${X(c.cta.slice(0,26))}</text></svg>`;}
function campaignKit(){let sections='';for(const lang of ['en','ar'])for(const a of assets){sections+=`<section class="export-page"><h2>${H(a.name)} — ${lang==='en'?'English':'Arabic'}</h2>${preview(a.id,lang)}</section>`;}const css=document.getElementById('app-styles').textContent;return `<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${H(s.brand.name)} Campaign Kit</title><style>${css}\n:root{--brand-primary:${s.brand.primary};--brand-accent:${s.brand.accent}}body{background:#f5f3f9}.campaign-export>.export-title{font-size:30px;padding:20px 0}.campaign-export .export-page{break-inside:avoid;padding:32px}.campaign-export .export-page h2{margin:0 0 20px}.campaign-export .social-canvas{max-width:510px}.campaign-export .site-preview,.campaign-export .email-preview{max-width:780px}</style></head><body><div class="campaign-export"><h1 class="export-title">✳ ${H(s.brand.name)} — ${H(s.brief.name)}</h1><p>Campaign version ${s.version} · English and Arabic · Demo creative kit</p><p style="color:#a35b31">Review copy, localization, product claims and HTML email compatibility before publishing.</p>${sections}</div></body></html>`;}
function exportAction(kind){const slug=safeFile(s.brand.name),lang=s.lang;if(kind==='all')downloadFile(`${slug}-campaign-kit-v${s.version}.html`,campaignKit(),'text/html;charset=utf-8');else if(kind==='json')downloadFile(`${slug}-campaign-v${s.version}.json`,JSON.stringify({brand:s.brand,brief:s.brief,version:s.version,assets:Object.fromEntries(assets.map(a=>[a.id,{en:getCopy(a.id,'en'),ar:getCopy(a.id,'ar')}])),approvals:s.approvals,history:s.history,qa:qaReport()},null,2),'application/json');else if(kind==='social')downloadFile(`${slug}-${s.asset.startsWith('social')?s.asset:'social0'}-${lang}.svg`,socialSVG(s.asset.startsWith('social')?s.asset:'social0',lang),'image/svg+xml');else downloadFile(`${slug}-${kind}-${lang}.html`,docExport(kind,lang),'text/html;charset=utf-8');}
// Clicks, edits and layout controls use event delegation so the app stays fully self-contained.
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el)return;const a=el.dataset.action;if(a==='menu'){document.getElementById('sidebar').classList.toggle('open');return}if(a==='nav'){navigate(el.dataset.view);return}if(a==='open-asset'){setAsset(el.dataset.id);return}if(a==='language'){s.lang=el.dataset.lang;render();return}if(a==='device'){s.device=el.dataset.device;render();return}if(a==='apply-brief'){applyBrief();return}if(a==='approve'){approve();return}if(a==='run-qa'){s.lastQA=new Date().toLocaleString();render();notify('All campaign variants scanned.');return}if(a==='restore-copy'){for(const f of ['headline','body','cta'])delete s.overrides[`${s.asset}|${s.lang}|${f}`];s.approvals[`${s.asset}|${s.lang}`]=false;render();notify('Selected asset restored to campaign templates.');return}if(a==='download-current'){exportAction(s.asset.startsWith('social')?'social':s.asset);return}if(a.startsWith('export-')){exportAction(a.slice(7));return}});
document.addEventListener('input',e=>{const el=e.target;if(el.dataset.edit){setOverride(el.dataset.edit,el.value);return}if(el.dataset.brief){draft[el.dataset.brief]=el.value;return}if(el.dataset.brand){s.brand[el.dataset.brand]=el.value;s.approvals={};updateTheme();save();if(['name','description','primary','accent'].includes(el.dataset.brand)){const p=document.getElementById('brandPreview');if(p)p.innerHTML=`<div class="brand-poster"><b>✳ ${H(s.brand.name)}</b><p>${H(s.brand.description)}</p></div>`;}return}});
document.addEventListener('change',e=>{if(e.target.dataset.brand){s.brand[e.target.dataset.brand]=e.target.value;save();render();notify('Brand settings saved. Approvals reset.')}});
render();
})();
</script>
</body>
</html>
