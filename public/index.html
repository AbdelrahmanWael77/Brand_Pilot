<script>
'use strict';
/* ============ BrandPilot — utilities, state, synthetic demo material, import pipeline ============ */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=p=>p+Math.random().toString(36).slice(2,9);
const fmt=n=>n==null||isNaN(n)?'—':Math.abs(n)>=1e6?(n/1e6).toFixed(1)+'M':Math.abs(n)>=1e4?(n/1e3).toFixed(1)+'k':Math.round(n).toLocaleString('en');
const pc=(a,b,d=1)=>b?(a/b*100).toFixed(d)+'%':'—';
const sgn=d=>(d>=0?'+':'')+(d*100).toFixed(0)+'%';
const today=()=>new Date().toISOString().slice(0,10);
const addDays=(d,n)=>{const x=new Date(d+'T00:00:00Z');x.setUTCDate(x.getUTCDate()+n);return x.toISOString().slice(0,10)};
const dayDiff=(a,b)=>Math.round((new Date(b+'T00:00:00Z')-new Date(a+'T00:00:00Z'))/864e5);
const sum=(a,k)=>a.reduce((s,r)=>s+(+r[k]||0),0);

function lineChart(labels,vals,label,color){const W=640,H=220,pl=46,pr=14,pt=14,pb=28,max=Math.max(1,...vals),n=labels.length,x=i=>pl+(n>1?i*(W-pl-pr)/(n-1):(W-pl-pr)/2),y=v=>pt+(H-pt-pb)*(1-v/max),step=Math.ceil(n/7);
 return`<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="${esc(label)}" direction="ltr">${[0,.5,1].map(t=>`<line x1="${pl}" x2="${W-pr}" y1="${y(max*t)}" y2="${y(max*t)}" stroke="#e2e8f0"/><text x="${pl-6}" y="${y(max*t)+4}" text-anchor="end" font-size="11" fill="#64748b">${fmt(max*t)}</text>`).join('')}${labels.map((l,i)=>i%step?'':`<text x="${x(i)}" y="${H-8}" text-anchor="middle" font-size="11" fill="#64748b">${esc(l)}</text>`).join('')}<polygon fill="${color}" opacity=".1" points="${x(0)},${y(0)} ${vals.map((v,i)=>x(i)+','+y(v)).join(' ')} ${x(n-1)},${y(0)}"/><polyline fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round" points="${vals.map((v,i)=>x(i)+','+y(v)).join(' ')}"/>${vals.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="3.5" fill="#fff" stroke="${color}" stroke-width="2"><title>${esc(labels[i])}: ${fmt(v)}</title></circle>`).join('')}</svg>`}
function weeklySeries(c,m){const src={sessions:['ga4','sessions'],enq:['ga4','enquiries'],reach:['meta','reach'],eng:['meta','engagements'],clicks:['meta','link_clicks'],sclicks:['gsc','clicks'],leads:['leads',null],qual:['leads','q']}[m],o={};c.data[src[0]].forEach(r=>{const w=addDays(r.date,-new Date(r.date+'T00:00:00Z').getUTCDay());o[w]=(o[w]||0)+(src[1]===null?1:src[1]==='q'?(isQ(r)?1:0):(+r[src[1]]||0))});const ks=Object.keys(o).sort();return{labels:ks.map(k=>k.slice(5)),v:ks.map(k=>o[k])}}

let USER=null;const LKEY='brandpilot.lang';
const AUTH={mode:'login',lang:'en',err:'',busy:false,email:''};
const AUTH_ERR={invalid_email:['Enter a valid email address.','أدخل بريداً إلكترونياً صحيحاً.'],invalid_password:['Password must be at least 8 characters.','يجب ألا تقل كلمة المرور عن 8 أحرف.'],too_many_attempts:["Too many attempts. Try again in a few minutes.","محاولات كثيرة. حاول مجدداً بعد بضع دقائق."],invalid_credentials:['Wrong email or password.','البريد الإلكتروني أو كلمة المرور غير صحيحة.'],email_taken:['An account with this email already exists. Sign in instead.','يوجد حساب بهذا البريد بالفعل. سجّل الدخول.'],network:['Cannot reach the server. Check that it is running and try again.','تعذّر الاتصال بالخادم. تأكد من تشغيله وحاول مجدداً.'],other:['Something went wrong. Please try again.','حدث خطأ. حاول مجدداً.']};
function authRender(){const ar=AUTH.lang==='ar',T=(en,a)=>ar?a:en,reg=AUTH.mode==='register',e=AUTH.err&&(AUTH_ERR[AUTH.err]||AUTH_ERR.other);
 document.documentElement.lang=AUTH.lang;document.documentElement.dir=ar?'rtl':'ltr';
 $('#app').innerHTML=`<main class="auth"><form class="card stack" id="authf" novalidate><div class="row"><div class="logo"><i>${ic('growth')}</i>BrandPilot</div><span class="sp"></span><button type="button" class="btn sm" id="authLang" aria-label="${T('Switch to Arabic','التبديل إلى الإنجليزية')}">${ar?'English':'العربية'}</button></div>
 <div><h2>${reg?T('Create your account','أنشئ حسابك'):T('Sign in','تسجيل الدخول')}</h2><p class="muted">${reg?T('Your companies and their data are private to your account.','شركاتك وبياناتها خاصة بحسابك.'):T('Sign in to open your companies.','سجّل الدخول لفتح شركاتك.')}</p></div>
 ${e?`<div class="err" role="alert">${T(e[0],e[1])}</div>`:''}
 <label class="f">${T('Email','البريد الإلكتروني')}<input type="email" name="email" dir="ltr" autocomplete="email" required value="${esc(AUTH.email)}"></label>
 <label class="f">${T('Password','كلمة المرور')}<input type="password" name="password" dir="ltr" autocomplete="${reg?'new-password':'current-password'}" required minlength="8"></label>
 ${reg?`<p class="muted">${T('At least 8 characters.','8 أحرف على الأقل.')}</p>`:''}
 <button class="btn pri" ${AUTH.busy?'disabled':''}>${AUTH.busy?T('Please wait…','يرجى الانتظار…'):reg?T('Create account','إنشاء الحساب'):T('Sign in','تسجيل الدخول')}</button>
 <p class="small ctr">${reg?T('Already have an account?','لديك حساب بالفعل؟'):T('New to BrandPilot?','جديد على BrandPilot؟')} <button type="button" class="lnk" id="authMode">${reg?T('Sign in','سجّل الدخول'):T('Create an account','أنشئ حساباً')}</button></p></form></main>`;
 const f=$('#authf');
 $('#authLang').onclick=()=>{AUTH.email=f.email.value;AUTH.lang=ar?'en':'ar';try{localStorage.setItem(LKEY,AUTH.lang)}catch(x){}authRender()};
 $('#authMode').onclick=()=>{AUTH.email=f.email.value;AUTH.mode=reg?'login':'register';AUTH.err='';authRender()};
 f.onsubmit=async ev=>{ev.preventDefault();if(AUTH.busy)return;const email=f.email.value.trim(),password=f.password.value;AUTH.email=email;AUTH.busy=true;AUTH.err='';authRender();
  let r=null,j={};try{r=await fetch('/api/auth/'+(reg?'register':'login'),{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({email,password})});j=await r.json().catch(()=>({}))}catch(x){}
  AUTH.busy=false;if(r&&r.ok&&j.user){USER=j.user;await startApp()}else{AUTH.err=!r?'network':(j.error||'other');authRender();const el=$('#authf')[AUTH.err==='invalid_email'||AUTH.err==='email_taken'?'email':'password'];if(el)el.focus()}};
 if(!AUTH.busy)(AUTH.email?f.password:f.email).focus()}
/* ---------- Server sync: companies live on the server, scoped to the signed-in account ---------- */
const SYNC={sent:{},t:0,busy:false,again:false,failed:false};
async function api(m,u,b,ka){const r=await fetch(u,{method:m,headers:b?{'content-type':'application/json'}:{},body:b?(typeof b==='string'?b:JSON.stringify(b)):undefined,keepalive:!!ka});if(r.status===401){location.reload();const e=new Error('signed out');e.status=401;throw e}if(!r.ok){const e=new Error('HTTP '+r.status);e.status=r.status;throw e}return r.json()}
const coName=c=>(String(c.name||'').trim()||'Untitled').slice(0,120);
const coBody=c=>JSON.stringify({name:coName(c),state:c});
async function createCo(name,o){const r=await api('POST','/api/companies',{name:coName({name})}),c=newCompany(Object.assign({},o,{name}));c.id=r.company.id;SYNC.sent[c.id]='';return c}
function syncFail(e){if(e&&e.status===401)return;toast(e&&e.status===413?L('This company data is too large to save to the server (5 MB limit). Remove large media or imports.','بيانات هذه الشركة أكبر من أن تُحفظ على الخادم (الحد 5 ميغابايت). احذف وسائط أو استيرادات كبيرة.'):L('Could not save to the server. Your latest changes are not saved yet — will retry.','تعذّر الحفظ على الخادم. آخر تغييراتك لم تُحفظ بعد — ستُعاد المحاولة.'),'err')}
function syncDowngrade(c,ids){let n=0;c.findings.forEach(f=>{if(ids.includes(f.id)&&f.status==='approved'){f.status='pending';f.primary=false;f.needs=true;f.noEv=true;n++}});if(n){c.kdirty=true;toast(L(`${n} finding(s) have no source evidence and were returned to review. Add the fact yourself instead, so it is labeled as entered manually.`,`${n} نتيجة بلا دليل من المصادر أُعيدت إلى المراجعة. أضف الحقيقة بنفسك لتُعلَّم كمدخلة يدوياً.`),'err')}return n>0}
async function syncNow(ka){clearTimeout(SYNC.t);if(!USER||!S)return;if(SYNC.busy){SYNC.again=true;return}SYNC.busy=true;let rekeyed=false,put=false;
 try{for(const id of Object.keys(SYNC.sent))if(!S.companies[id]){await api('DELETE','/api/companies/'+id);delete SYNC.sent[id]}
  for(const id of Object.keys(S.companies)){const c=S.companies[id];
   if(!(id in SYNC.sent)){const r=await api('POST','/api/companies',{name:coName(c)}),nid=r.company.id;delete S.companies[id];c.id=nid;S.companies[nid]=c;if(S.active===id)S.active=nid;SYNC.sent[nid]='';rekeyed=true}
   const body=coBody(c);if(body!==SYNC.sent[c.id]){const r=await api('PUT','/api/companies/'+c.id+'/state',body,ka===true&&body.length<60000);SYNC.sent[c.id]=body;put=true;const dg=r&&r.knowledge&&r.knowledge.downgraded;if(dg&&dg.length&&syncDowngrade(c,dg))rekeyed=true}}
  SYNC.failed=false}
 catch(e){if(!SYNC.failed){SYNC.failed=true;syncFail(e)}if(e.status!==413&&e.status!==401)SYNC.t=setTimeout(syncNow,5000)}
 SYNC.busy=false;const again=SYNC.again;SYNC.again=false;if(rekeyed||(put&&(S.ui.view==='audit'||S.ui.view==='qa')))R();else if(again)save()}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'&&USER&&S)syncNow(true)});
async function startApp(){let p=null;try{p=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!p||p.v!==1)p={};
 S={v:1,lang:AUTH.lang,active:p.active||'',companies:{},ui:p.ui||{view:'dash'},ai:p.ai||{mode:'rules',endpoint:''}};SYNC.sent={};
 try{const list=(await api('GET','/api/companies')).companies;
  for(const row of list){const st=(await api('GET','/api/companies/'+row.id+'/state')).state,c=newCompany(st||{name:row.name});c.id=row.id;S.companies[row.id]=c;SYNC.sent[row.id]=st?coBody(c):''}
  if(!list.length){const c=await createCo(L('My company','شركتي'));S.companies[c.id]=c;S.ui.view='dash'}}
 catch(e){if(e.status===401)return;const ar=AUTH.lang==='ar';$('#app').innerHTML=`<main class="auth"><div class="card stack"><div class="err" role="alert">${ar?AUTH_ERR.network[1]:AUTH_ERR.network[0]}</div><button class="btn pri" onclick="location.reload()">${ar?'إعادة المحاولة':'Retry'}</button></div></main>`;return}
 if(!S.companies[S.active])S.active=Object.keys(S.companies)[0];boot()}
async function start(){try{AUTH.lang=localStorage.getItem(LKEY)||(JSON.parse(localStorage.getItem(KEY))||{}).lang||'en'}catch(e){}if(AUTH.lang!=='ar')AUTH.lang='en';
 let r=null;try{r=await fetch('/api/auth/me')}catch(e){}
 if(r&&r.ok){USER=(await r.json()).user;await startApp()}else{if(!r||r.status!==401)AUTH.err=r?'other':'network';authRender()}}
start();

</script>
</body>
</html>
