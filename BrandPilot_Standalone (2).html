function makeAssets(p){return langs.flatMap(lang=>kinds.map(([kind,index])=>({id:uid(),lang,kind,index,content:generateContent(p,kind,lang,index),overrides:[],style:{bg:p.brand.primary,fg:'#ffffff',accent:p.brand.accent},dir:lang==='ar'?'rtl':'ltr',approved:false,approvalAt:null,version:p.briefVersion,stale:[],changedAt:stamp()})));}
function diffs(oldObj,newObj,prefix=''){const keys=new Set([...Object.keys(oldObj||{}),...Object.keys(newObj||{})]);return [...keys].flatMap(k=>JSON.stringify(oldObj?.[k])===JSON.stringify(newObj?.[k])?[]:[{key:prefix+k,from:oldObj?.[k],to:newObj?.[k]}]);}

function applyUpdate(p,oldBrand,oldBrief,type){const changes=[...diffs(oldBrand,p.brand,'brand.'),...diffs(oldBrief,p.brief,'brief.')];if(!changes.length)return {changes:[],affected:[]};p.briefVersion+=1;const previous={brand:oldBrand,brief:oldBrief};const affected=[],invalidated=[];

for(const a of p.assets){const oldAuto=generateContent(previous,a.kind,a.lang,a.index),fresh=generateContent(p,a.kind,a.lang,a.index);let changed=false;
for(const k of Object.keys(fresh)){
 const latest=fresh[k],original=oldAuto[k];
 if(original===latest)continue;
 if(!a.overrides.includes(k)||a.content[k]===original||k==='cta'||k==='disclaimer'){
  if(a.content[k]!==latest){a.content[k]=latest;changed=true;}
  if(k==='cta'||k==='disclaimer')a.overrides=a.overrides.filter(x=>x!==k);
 }else{
  // Manual edits are kept but checked against now-obsolete copy.
  const oldPhrase=a.lang==='ar'?oldOfferAr:oldOffer;
  if(oldPhrase && oldPhrase!==newOffer && hasText(a.content[k],oldPhrase) && !a.stale.includes('offer'))a.stale.push('offer');
 }
}

if(oldBrand.accent!==p.brand.accent&&a.style.accent===oldBrand.accent){a.style.accent=p.brand.accent;changed=true}
const toneChanged=oldBrand.tone!==p.brand.tone,termChanged=oldBrand.prohibitedTermsEn!==p.brand.prohibitedTermsEn||oldBrand.prohibitedTermsAr!==p.brand.prohibitedTermsAr;
const changedAudience=oldBrief.audienceEn!==p.brief.audienceEn||oldBrief.audienceAr!==p.brief.audienceAr;
if(toneChanged||termChanged||(changedAudience&&!changed))changed=true;

}

function editAsset(p,a,newValues,styleValues,alt){let changes=[];for(const k in newValues){const n=newValues[k],old=a.content[k];if(old!==n){changes.push({key:`${a.id}.${k}`,from:old,to:n});a.content[k]=n;if(!a.overrides.includes(k))a.overrides.push(k)}}for(const k in styleValues){const n=styleValues[k],old=a.style[k];if(old!==n){changes.push({key:`${a.id}.style.${k}`,from:old,to:n});a.style[k]=n}}if(a.content.alt!==alt){changes.push({key:`${a.id}.alt`,from:a.content.alt,to:alt});a.content.alt=alt;if(!a.overrides.includes('alt'))a.overrides.push('alt')}

function assetById(id){return currentProject().assets.find(a=>a.id===id)}
function contrast(hex1,hex2){function luminance(h){const x=h.replace('#','');const full=x.length===3?x.split('').map(c=>c+c).join(''):x;if(!/^[\da-f]{6}$/i.test(full))return 0;const rgb=[0,2,4].map(i=>parseInt(full.slice(i,i+2),16)/255).map(c=>c<=.04045?c/12.92:Math.pow((c+.055)/1.055,2.4));return rgb[0]*.2126+rgb[1]*.7152+rgb[2]*.0722}let a=luminance(hex1),b=luminance(hex2);return (Math.max(a,b)+.05)/(Math.min(a,b)+.05)}
function runQA(p){const issues=[];function push(severity,rule,message,asset){issues.push({severity,rule,message,assetId:asset?.id||null,asset:asset?assetLabel(asset):'Campaign'})}

if(!splitLines(p.brief.factsEn).length)push('error','facts','Add authorized English product facts to the campaign brief.');

if(!a.content.cta?.trim()||a.content.cta.trim()!==expectedCta.trim())push('error','cta',`CTA must match the approved ${a.lang.toUpperCase()} CTA: “${expectedCta}”.`,a);

if(disclaimer&&a.content.disclaimer.trim()!==disclaimer.trim())push('error','disclaimer','Mandatory campaign disclaimer is missing or inconsistent.',a);
const banned=[...splitLines(p.brand.prohibitedTermsEn.replace(/,/g,'\n')),...splitLines(p.brand.prohibitedTermsAr.replace(/,/g,'\n'))];for(const term of banned){if(hasText(text,term))push('error','prohibited',`Prohibited expression detected: “${term}”.`,a)}

if(a.kind==='social'&&contrast(a.style.bg,a.style.fg)<4.5)push('warning','contrast',`Text-to-background contrast is ${contrast(a.style.bg,a.style.fg).toFixed(2)}:1; target at least 4.5:1.`,a);

if(p.brief.offerDays>0&&(a.kind!=='social'||a.index===2) && !text.includes(String(p.brief.offerDays)))push('error','offer',`The active ${p.brief.offerDays}-day free trial is missing from this offer-bearing asset.`,a);

function downloadBlob(data,name,mime='application/octet-stream'){const blob=data instanceof Blob?data:new Blob([data],{type:mime});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)}
const encoder=new TextEncoder();
function crc32(data){let n=0xffffffff;for(const byte of data){n^=byte;for(let j=0;j<8;j++)n=(n>>>1)^((n&1)?0xedb88320:0)}return (n^0xffffffff)>>>0}
function writeShort(dv,offset,n){dv.setUint16(offset,n,true)}function writeLong(dv,offset,n){dv.setUint32(offset,n>>>0,true)}
function buildZip(entries){let chunks=[],central=[],offset=0;for(const entry of entries){const name=encoder.encode(entry.path),data=encoder.encode(entry.data),crc=crc32(data);let local=new Uint8Array(30+name.length),v=new DataView(local.buffer);writeLong(v,0,0x04034b50);writeShort(v,4,20);writeShort(v,6,0x0800);writeShort(v,8,0);writeLong(v,14,crc);writeLong(v,18,data.length);writeLong(v,22,data.length);writeShort(v,26,name.length);local.set(name,30);chunks.push(local,data);let c=new Uint8Array(46+name.length),cv=new DataView(c.buffer);writeLong(cv,0,0x02014b50);writeShort(cv,4,20);writeShort(cv,6,20);writeShort(cv,8,0x0800);writeLong(cv,16,crc);writeLong(cv,20,data.length);writeLong(cv,24,data.length);writeShort(cv,28,name.length);writeLong(cv,42,offset);c.set(name,46);central.push(c);offset+=local.length+data.length}
const centralSize=central.reduce((n,c)=>n+c.length,0),end=new Uint8Array(22),endView=new DataView(end.buffer);writeLong(endView,0,0x06054b50);writeShort(endView,8,entries.length);writeShort(endView,10,entries.length);writeLong(endView,12,centralSize);writeLong(endView,16,offset);return new Blob([...chunks,...central,end],{type:'application/zip'})}

function quickOffer(e){e.preventDefault();const p=currentProject(),n=Math.max(0,Math.min(365,Number(fieldValue('quickDays'))||0));const oldBrand=clone(p.brand),oldBrief=clone(p.brief);p.brief.offerDays=n;const result=applyUpdate(p,oldBrand,oldBrief,'offer duration revised');render();toast(result.changes.length?`Offer changed to ${n} days. ${result.affected.length} assets updated.`:'Offer is unchanged.')}
function saveAsset(e){e.preventDefault();const p=currentProject(),a=assetById(selectedAssetId);if(!a)return;const fields={};for(const k of Object.keys(a.content)){if(k==='alt')continue;fields[k]=fieldValue('edit_'+k)}const style={};if(a.kind==='social'){style.bg=fieldValue('edit_bg');style.fg=fieldValue('edit_fg');style.accent=fieldValue('edit_accent')}const count=editAsset(p,a,fields,style,fieldValue('edit_alt'));render();toast(count?`Saved ${assetLabel(a)}. Approval reset.`:'No content changes to save.')}
function toggleApproval(){const p=currentProject(),a=assetById(selectedAssetId);if(!a)return;if(!a.approved){const errors=runQA(p).filter(i=>i.assetId===a.id&&i.severity==='error');if(errors.length){toast(`Resolve ${errors.length} blocking error(s) in this asset before approval.`);return}if(!confirm('Confirm that a human has reviewed this asset for factual support, design and appropriate localization?'))return;a.approved=true;a.approvalAt=stamp()}else{a.approved=false;a.approvalAt=null}p.history.unshift({id:uid(),at:stamp(),type:'review status',summary:`${a.approved?'Approved':'Revoked approval for'} ${assetLabel(a)}`,changes:[],affected:[a.id],invalidated:[]});save();render();toast(a.approved?'Asset approved by user.':'Asset approval revoked.')}
function regenerate(){if(!confirm('Regenerate all 12 assets? This will permanently replace manual asset edits and reset all approvals in this workspace.'))return;const p=currentProject(),invalidated=p.assets.filter(a=>a.approved).map(a=>a.id);p.assets=makeAssets(p);selectedAssetId=null;p.history.unshift({id:uid(),at:stamp(),type:'templates rebuilt',summary:'All bilingual templates regenerated from approved brief',changes:[],affected:p.assets.map(a=>a.id),invalidated});save();render();toast('12 campaign assets rebuilt.')}
function importProject(file){if(!file)return;file.text().then(raw=>{let parsed;try{parsed=JSON.parse(raw)}catch(e){toast('Invalid JSON file.');return}const project=parsed.project||parsed;if(!project.brand||!project.brief||!Array.isArray(project.assets)||!project.assets.every(a=>a.content&&a.lang&&a.kind)){toast('File is not a valid BrandPilot project.');return}const p=clone(project);p.id=uid();p.history=Array.isArray(p.history)?p.history:[];p.briefVersion=Number(p.briefVersion)||1;p.brand.name=String(p.brand.name||'Imported brand');state.projects.push(p);state.activeId=p.id;selectedAssetId=null;route='overview';save();render();toast(`Imported ${p.brand.name} as a new workspace.`)}).catch(()=>toast('Unable to read project file.'))}
function createNewBrand(){const name=prompt('New brand name (editable later):');if(!name?.trim())return;const b=fakeBrand(name.trim()),p=createProject(b,emptyBrief());state.projects.push(p);state.activeId=p.id;selectedAssetId=null;save();navigate('brand');toast('New brand workspace created. Complete the brand and brief before publishing.')}
document.addEventListener('click',e=>{const nav=e.target.closest('[data-nav]');if(nav){e.preventDefault();navigate(nav.dataset.nav);return}const assetBtn=e.target.closest('[data-open-asset],[data-asset]');if(assetBtn){selectedAssetId=assetBtn.dataset.openAsset||assetBtn.dataset.asset;studioLang=assetById(selectedAssetId)?.lang||'en';studioKind='all';navigate('studio');return}const lang=e.target.closest('[data-language]');if(lang){studioLang=lang.dataset.language;render();return}const kind=e.target.closest('[data-kind]');if(kind){studioKind=kind.dataset.kind;render();return}const filter=e.target.closest('[data-qa-filter]');if(filter){qaFilter=filter.dataset.qaFilter;render();return}const action=e.target.closest('[data-action]');if(!action)return;switch(action.dataset.action){case 'download-project':downloadProject();break;case 'export-zip':exportPackage();break;case 'download-qa':downloadBlob(JSON.stringify(runQA(currentProject()),null,2),'brandpilot-qa-report.json','application/json');toast('QA report downloaded.');break;case 'download-asset':{const a=assetById(selectedAssetId);if(a){const f=assetFile(a,currentProject());downloadBlob(f.data,f.path.split('/').pop(),f.mime);toast('Editable asset exported.')}break}case 'toggle-approval':toggleApproval();break;case 'regenerate':regenerate();break;}});
document.addEventListener('submit',e=>{if(e.target.id==='brandForm')updateBrand(e);else if(e.target.id==='briefForm')updateBrief(e);else if(e.target.id==='offerQuickForm')quickOffer(e);else if(e.target.id==='assetEditForm')saveAsset(e)});
document.addEventListener('change',e=>{if(e.target.id==='workspacePicker')switchProject(e.target.value);if(e.target.id==='fileImport')importProject(e.target.files[0]);if(e.target.type==='color'&&['primary','secondary','accent','text'].includes(e.target.id)){let el=e.target.closest('.field')?.querySelector('span');if(el)el.textContent=e.target.value}});
$('#addProject').addEventListener('click',createNewBrand);
$('#topExport').addEventListener('click',downloadProject);
$('#menuToggle').addEventListener('click',()=>$('.sidebar').classList.toggle('open'));
window.addEventListener('storage',e=>{if(e.key===STORE_KEY)toast('This project was changed in another tab. Reload to see updated state.')});
render();
if(!HAS_LOCAL_STORAGE){$('.top-chip').textContent='Storage unavailable · export JSON';}

</script>
</body>
</html>
